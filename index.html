        // ==========================================

        // Firebase 初始化驗證
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);

        };
        initAuth();

        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                // 已登入：解鎖 AI
                window.currentUser = user;
                document.getElementById('aiLockScreen').classList.add('hidden');

                document.getElementById('sidebarLoggedIn').classList.remove('hidden');

                if(user.photoURL) document.getElementById('userAvatar').src = user.photoURL;
            } else {
                // 未登入：鎖定 AI
                window.currentUser = null;
                document.getElementById('aiLockScreen').classList.remove('hidden');
                document.getElementById('aiUnlockedScreen').classList.add('hidden');
                document.getElementById('sidebarLoggedOut').classList.remove('hidden');
                document.getElementById('sidebarLoggedIn').classList.add('hidden');
                document.getElementById('sidebarLoggedIn').classList.remove('flex');
            }
        });

        // 暴露給 HTML 點擊的事件
        window.loginWithGoogle = async () => {
            try {
                // 原本的錯誤檢查，因為已經填入真實資料，所以可以移除，但保留著也無妨，或根據需要修改
                // if(firebaseConfig.apiKey === "AIzaSyAdYfGjN5C408QOqYsW9mXGY2EmFF7MHtI" && firebaseConfig.authDomain === "YOUR_PROJECT.firebaseapp.com") {
                //     throw new Error("系統管理員尚未設定 Firebase Config，請先於程式碼中完成設定。");
                // }
                await signInWithPopup(auth, provider);
            } catch (error) {
                window.showErrorModal(error.message);
            }
        };
        window.logout = async () => { await signOut(auth); };

        window.showErrorModal = (msg) => {
            document.getElementById('errorModalText').innerText = msg;
            document.getElementById('errorModal').classList.remove('hidden');
            document.getElementById('errorModal').classList.add('flex');
        };
        window.closeErrorModal = () => {
            document.getElementById('errorModal').classList.add('hidden');
            document.getElementById('errorModal').classList.remove('flex');
        };

        // --- UI Navigation ---
        window.showSection = (sectionId) => {
            document.querySelectorAll('.section-content').forEach(el => {
                el.classList.add('hidden'); el.classList.remove('fade-in'); 
            });
            const target = document.getElementById(sectionId);
            target.classList.remove('hidden'); void target.offsetWidth; target.classList.add('fade-in');
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('nav-active', 'bg-gray-50', 'text-blue-800');
                btn.classList.add('text-gray-600');
            });

            document.getElementById(`nav-${sectionId}`).classList.remove('text-gray-600');

        };

        // --- Charts & Simulator Logic ---
        Chart.defaults.font.family = "'Noto Sans TC', sans-serif";
        
        // Safety Chart (Interactive)
        const ctxSafety = document.getElementById('safetyChart').getContext('2d');
        const safetyChart = new Chart(ctxSafety, {
            type: 'bubble',
            data: {
                datasets: [
                    { label: '團隊現狀', data: [{x: 5, y: 5, r: 15}], backgroundColor: '#2563eb', borderColor: '#fff', borderWidth: 2 },
                    { label: '參考區間', data: [{x:2.5,y:2.5,r:8},{x:7.5,y:2.5,r:8},{x:2.5,y:7.5,r:8},{x:7.5,y:7.5,r:8}], backgroundColor: ['#94a3b8', '#f87171', '#fbbf24', '#4ade80'] }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: {
                    x: { min: 0, max: 10, title: { display: true, text: '老闆的要求壓力' }, grid: { color: (ctx) => ctx.tick.value === 5 ? '#94a3b8' : '#e2e8f0', lineWidth: (ctx) => ctx.tick.value === 5 ? 2 : 1 } },
                    y: { min: 0, max: 10, title: { display: true, text: '員工的安全感' }, grid: { color: (ctx) => ctx.tick.value === 5 ? '#94a3b8' : '#e2e8f0', lineWidth: (ctx) => ctx.tick.value === 5 ? 2 : 1 } }
                }
            }
        });

        const updateSafety = () => {
            const std = document.getElementById('inputStandard').value;
            const safe = document.getElementById('inputSafety').value;
            safetyChart.data.datasets[0].data[0].x = std;
            safetyChart.data.datasets[0].data[0].y = safe;
            safetyChart.update();
            const resText = document.getElementById('zoneResult'), resDesc = document.getElementById('zoneDesc');
            if (std < 5 && safe < 5) { resText.innerHTML="冷漠區 <span class='text-sm'>(員工混日子)</span>"; resText.className="text-gray-500 font-bold text-xl"; resDesc.innerText="建議：需要設立明確的獎懲與目標。"; }
            else if (std >= 5 && safe < 5) { resText.innerHTML="焦慮區 <span class='text-sm'>(員工害怕犯錯)</span>"; resText.className="text-red-600 font-bold text-xl"; resDesc.innerText="🚨 危險！請給予員工犯錯的空間，保護他們不被外部客戶欺負。"; }
            else if (std < 5 && safe >= 5) { resText.innerHTML="舒適區 <span class='text-sm'>(一團和氣)</span>"; resText.className="text-amber-500 font-bold text-xl"; resDesc.innerText="大家感情很好，但容易陷入盲從。建議：適度給予業績壓力。"; }
            else { resText.innerHTML="學習區 <span class='text-sm'>(戰鬥力滿點)</span>"; resText.className="text-green-600 font-bold text-xl"; resDesc.innerText="✅ 完美狀態！員工遇到不合理的奧客敢跟老闆報告。"; }
        };
        document.getElementById('inputStandard').addEventListener('input', updateSafety);
        document.getElementById('inputSafety').addEventListener('input', updateSafety);
        updateSafety();

        // Dashboards & Static Charts
        new Chart(document.getElementById('dashboardChart').getContext('2d'), { type: 'bar', data: { labels: ['索取者', '互惠者', '給予者'], datasets: [{ data: [10, 25, 65], backgroundColor: ['#f87171', '#60a5fa', '#4ade80'], borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } } });
        new Chart(document.getElementById('giverTakerChart').getContext('2d'), { type: 'bar', data: { labels: ['不懂保護的給予者', '索取者', '互惠者', '聰明給予者'], datasets: [{ data: [30, 60, 75, 95], backgroundColor: ['#cbd5e1', '#f87171', '#60a5fa', '#15803d'], borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } } });
        new Chart(document.getElementById('circlesChart').getContext('2d'), { type: 'doughnut', data: { labels: ['核心圈', '中間層', '外圈'], datasets: [{ data: [15, 35, 100], backgroundColor: ['#1e3a8a', '#3b82f6', '#e2e8f0'], borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '50%', plugins: { legend: { display: false } } } });
        new Chart(document.getElementById('moatChart').getContext('2d'), { type: 'bar', indexAxis: 'y', data: { labels: ['價值觀 (你是誰)', '共感力 (你懂我)', '透明度 (你誠實)', '專業力 (你懂)'], datasets: [{ data: [90, 70, 50, 30], backgroundColor: ['#1e3a8a', '#2563eb', '#60a5fa', '#93c5fd'], borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { display: false } } } } });

        // Scenarios Data
        const scenarios = {
            1: { title: "情境演練 A：仲介拗免費試算", text: "遇到不常配合的仲介打來：「妹妹，這土地很急，幫我算一下增值稅，算好我就叫客戶給你們宏國辦！」", options: [{ text: "❌ 害怕得罪對方，立刻幫他算。", feedbackTitle: "錯誤！這會被當成免費勞工。", feedback: "對方可能拿免費數據去別家辦理。", type: "bad" }, { text: "✅ 回覆：「好的大哥，麻煩您先把『委託單』填妥傳給我！」", feedbackTitle: "正確！設立「付費牆」。", feedback: "透過表單增加他的麻煩，過濾白嫖客。", type: "good" }] },
            2: { title: "情境演練 B：防止被搶功勞", text: "辛苦整理的繼承表交給業務後，業務在客戶面前說：「這都是我找私人關係特別幫你處理的」", options: [{ text: "❌ 覺得算了，只要拿到代書費就好。", feedbackTitle: "錯誤！客戶會產生誤解。", feedback: "長久下來，宏國與易丞的專業會被貶低。", type: "bad" }, { text: "✅ 所有檔案加上浮水印，並直接傳給客戶。", feedbackTitle: "正確！留下「工作足跡」。", feedback: "主動聯繫客戶回報進度，不讓別人收割妳的努力！", type: "good" }] },
            3: { title: "情境演練 C：大客戶拗助理", text: "帶來很多業績的建商窗口，常叫助理幫他跑腿印私人文件。", options: [{ text: "❌ 為了大局默默吞下去。", feedbackTitle: "錯誤！陷入「焦慮區」。", feedback: "對方的要求只會得寸進尺，助理會受不了離職。", type: "bad" }, { text: "✅ 向老闆報告，請老闆出面設定界線。", feedbackTitle: "正確！讓老闆來當黑臉！", feedback: "楊代書主動跟對方溝通，保護團隊資源！", type: "good" }] }
        };

        window.loadScenario = (id) => {
            const data = scenarios[id];
            document.getElementById('scenarioContainer').classList.remove('hidden');
            document.getElementById('scenTitle').innerText = data.title;
            document.getElementById('scenText').innerText = data.text;
            document.getElementById('scenFeedback').classList.add('hidden');
            
            const optionsDiv = document.getElementById('scenOptions');
            optionsDiv.innerHTML = ''; optionsDiv.classList.remove('hidden');
            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-4 border-2 border-blue-200 rounded-lg font-bold text-slate-700 hover:bg-blue-50 transition-all text-left";
                btn.innerText = opt.text;
                btn.onclick = () => window.showFeedback(opt);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('scenarioContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        window.showFeedback = (option) => {
            document.getElementById('scenOptions').classList.add('hidden');
            document.getElementById('aiDraftActionArea').classList.add('hidden');
            document.getElementById('aiDraftLockArea').classList.add('hidden');
            document.getElementById('aiDraftResult').classList.add('hidden');
            
            const fbDiv = document.getElementById('scenFeedback');
            fbDiv.classList.remove('hidden');
            document.getElementById('feedbackTitle').innerText = option.feedbackTitle;
            document.getElementById('feedbackText').innerText = option.feedback;
            
            if (option.type === 'good') {
                fbDiv.className = "mt-6 p-6 bg-green-50 border border-green-200 rounded-lg fade-in";
                document.getElementById('feedbackTitle').className = "block mb-2 text-xl font-bold text-green-800";
                
                // Auth Check for AI Draft
                if (window.currentUser) {
                    document.getElementById('aiDraftActionArea').classList.remove('hidden');
                    window.currentDraftContext = option.feedback;
                } else {
                    document.getElementById('aiDraftLockArea').classList.remove('hidden');
                }
            } else {
                fbDiv.className = "mt-6 p-6 bg-red-50 border border-red-200 rounded-lg fade-in";
                document.getElementById('feedbackTitle').className = "block mb-2 text-xl font-bold text-red-800";
            }
        };

        window.resetScenario = () => {
            document.getElementById('scenOptions').classList.remove('hidden');
            document.getElementById('scenFeedback').classList.add('hidden');
        };

        // --- Gemini API Logic ---
        async function fetchGeminiAPI(prompt, systemInstruction = "") {
            // 這個錯誤檢查也要更新，確認 apiKey 不為空
            if(!apiKey || apiKey === "YOUR_GEMINI_API_KEY") throw new Error("尚未設定 Gemini API Key！請系統管理員於原始碼中填入。");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };

            let retries = 0; const maxRetries = 5;
            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`API 錯誤: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "無法生成內容。";
                } catch (error) {
                    retries++;
                    if (retries >= maxRetries) { console.error(error); throw error; }
                    await new Promise(r => setTimeout(r, Math.pow(2, retries - 1) * 1000));
                }
            }
        }

        window.analyzeCustomScenario = async () => {
            const text = document.getElementById('aiCustomScenarioInput').value.trim();
            if (!text) return window.showErrorModal("請先輸入情境！");
            
            document.getElementById('aiAnalyzeBtn').disabled = true;
            document.getElementById('aiAnalyzeSpinner').classList.remove('hidden');
            document.getElementById('aiCustomScenarioResult').classList.add('hidden');

            try {
                const sys = "你是一位專為『宏國地政 | 易丞地政』設計的管理顧問。";
                const usr = `請分析情境：「${text}」\n1. 判斷對方動機\n2. 提出防禦步驟。\n直接使用HTML輸出，無markdown。`;
                const res = await fetchGeminiAPI(usr, sys);
                document.getElementById('aiCustomScenarioResult').innerHTML = res;
                document.getElementById('aiCustomScenarioResult').classList.remove('hidden');
            } catch(e) { window.showErrorModal(e.message); }
            
            document.getElementById('aiAnalyzeBtn').disabled = false;
            document.getElementById('aiAnalyzeSpinner').classList.add('hidden');
        };

        window.generateDraftEmail = async () => {
            document.getElementById('aiDraftBtn').disabled = true;
            document.getElementById('aiDraftSpinner').classList.remove('hidden');
            document.getElementById('aiDraftResult').classList.add('hidden');

                const res = await fetchGeminiAPI(usr, sys);
                document.getElementById('aiDraftResult').innerHTML = `<strong>✨ AI 草擬訊息（可直接複製修改）：</strong><br><br>` + res;
                document.getElementById('aiDraftResult').classList.remove('hidden');
            } catch(e) { window.showErrorModal(e.message); }
            
            document.getElementById('aiDraftBtn').disabled = false;
            document.getElementById('aiDraftSpinner').classList.add('hidden');
        };

    </script>
